[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-control-bridge-windows-ui"
version = "0.1.0"
description = "Safety-gated Windows UI sidecar for Desktop Commander Remote"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
